[server]
headless = true
address = "127.0.0.1"
maxUploadSize = 5

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#087F73"
backgroundColor = "#FAFBF9"
secondaryBackgroundColor = "#EEF3EF"
textColor = "#182D29"
font = "sans-serif"
headingFont = "sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "12px"
buttonRadius = "8px"
borderColor = "#D9E3DD"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "2rem"
chartCategoricalColors = ["#087F73", "#DB9460", "#5E75A8"]

[theme.sidebar]
backgroundColor = "#EAF1EC"
secondaryBackgroundColor = "#FAFBF9"
paddingTop = "1.5rem"
